# Builds the Windows and Mac download zips and attaches them to the release.
# How to release: bump VERSION in app_info.py, then on GitHub: Releases > "Draft a new release",
# tag it v<VERSION> (e.g. v1.0.1), write what's new, and Publish. This workflow does the rest.
name: Build release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import app_info; print(app_info.VERSION)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG doesn't match VERSION $VERSION in app_info.py. Update app_info.py and release again."
            exit 1
          fi

      - name: Check the code at least compiles
        run: python3 -m compileall -q .

      - name: Build the Windows and Mac zips
        run: |
          python3 build_release.py "${GITHUB_REF_NAME}"

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/*.zip --clobber
