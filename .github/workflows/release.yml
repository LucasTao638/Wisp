# Builds the download zip and attaches it to the release.
# How to release: bump VERSION in app_info.py, then on GitHub: Releases > "Draft a new release",
# tag it v<VERSION> (e.g. v1.0.1), write what's new, and Publish. This workflow does the rest.
name: Build release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import app_info; print(app_info.VERSION)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG doesn't match VERSION $VERSION in app_info.py. Update app_info.py and release again."
            exit 1
          fi

      - name: Check the code at least compiles
        run: python3 -m compileall -q .

      - name: Build wisp-${{ github.ref_name }}.zip
        run: |
          mkdir -p build/wisp
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude '__pycache__' ./ build/wisp/
          cd build && zip -qr "wisp-${GITHUB_REF_NAME}.zip" wisp

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "build/wisp-${GITHUB_REF_NAME}.zip" --clobber
